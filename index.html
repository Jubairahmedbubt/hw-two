<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 02</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <center>
        <form action="#" method="post">
            <h3 class="name">Your Name</h3>
            <input type="text" placeholder="Enter Your Name" />
            <h3 class="email">Your Email</h3>
            <input type="number" placeholder="Enter your email">
            <h3 class="phonenumber">Your Phone Number</h3>
            <input type="number" placeholder="Enter your Phone Number">
            <h3 class="password">Your Password</h3>
            <input type="text" placeholder="Enter your password">
            <h3>Your Date of Birth</h3>
            <input type="date">
           <h3 class="gender">Select your Gender</h3>
           <input type="radio" Name="Gender">Male
           <input type="radio" Name="Gender">Female
           <input type="radio" Name="Gender">Other

           <h3>Select your Hobbies</h3>
           <input type="checkbox" Name="Hobbies">Gardening
           <input type="checkbox" Name="Hobbies">Drawing
           <input type="checkbox" Name="Hobbies">Hiking
           <input type="checkbox" Name="Hobbies">Photography
           <input type="checkbox" Name="Hobbies">Cooking
           
           <h3 class="color">Whats your Favourite Color?</h3>
           <input type="color">

           <h3 class="photo">Upload your photo</h3>
           <input type="file">
           <h3 class="country">Your Country</h3>
           <select>
           <option>Bangladesh</option>
           <option>America</option>
           <option>Norway</option>
           <option>Argentina</option></select>
    </center>
</body>

</html>
